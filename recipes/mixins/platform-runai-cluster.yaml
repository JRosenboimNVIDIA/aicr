# platform-runai-cluster mixin: brings in the Run:ai cluster agent.
#
# The cluster chart federates GPU/node metrics from kube-prometheus-stack
# (declared as a dependencyRef so the bundler installs Prometheus first).
# The cluster registers itself with an existing Run:ai Control Plane via
# its REST API at install time and consumes a UID + clientSecret as
# chart values — that handoff is intentionally out-of-band so this mixin
# stays cluster-agnostic.
#
# Required deploy-time --set values (or pre-create the Secret and use
# controlPlane.existingSecret instead):
#   --set runaicluster:controlPlane.url=<fqdn>
#   --set runaicluster:cluster.url=<fqdn>
#   --set runaicluster:cluster.uid=<uuid-from-CP-API>
#   --set runaicluster:controlPlane.clientSecret=<secret-from-CP-API>
#
# Opted into by a leaf overlay via spec.mixins: [platform-runai-cluster].

kind: RecipeMixin
apiVersion: aicr.nvidia.com/v1alpha1
metadata:
  name: platform-runai-cluster
spec:
  componentRefs:
    - name: runai-cluster
      type: Helm
      valuesFile: components/runai-cluster/values.yaml
      dependencyRefs:
        - kube-prometheus-stack
